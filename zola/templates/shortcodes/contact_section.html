<section class="contact section">
  <div class="mb-5">
    <iframe style="width: 100%; height: 400px;" src="https://www.google.com/maps/d/u/0/embed?mid=1XLTZ_Chx_Y2RtBMLBRMfEaYfowOBZ2c&ehbc=2E312F&noprof=1" frameborder="0" allowfullscreen=""></iframe>
  </div>
  <div class="container" data-aos="fade">
    <div class="info">
      <h3>{{ heading }}</h3>
      {{ body | markdown | safe }}
      <div class="info-item d-flex">
        <i class="bi bi-geo-alt flex-shrink-0"></i>
        <div>
          <h4>{{ address_label }}</h4>
          <p>11-13 Rue Pierre et Marie Curie 75231 Paris Cedex 05 France</p>
        </div>
      </div>
      <div class="info-item d-flex">
        <i class="bi bi-envelope flex-shrink-0"></i>
        <div>
          <h4>{{ email_label }}</h4>
          <p><a href="mailto:egmo2026@animath.fr">egmo2026@animath.fr</a></p>
        </div>
      </div>
    </div>
  </div>
</section>
